<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download startet...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #2da44e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <h1>Dein Download startet automatisch...</h1>
    <p>Falls der Download nicht von selbst beginnt, klicke bitte auf den Button:</p>
    
    <!-- Ersetze DEINE-DATEI.ENDUNG mit deinem echten Dateinamen -->
    <a id="download-link" href="./DEINE-DATEI.ENDUNG" download="DEINE-DATEI.ENDUNG" class="btn">
        Datei manuell herunterladen
    </a>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('download-link').click();
        });
    </script>

</body>
</html>
